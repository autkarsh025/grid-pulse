name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-java@v4       # Spark runs on the JVM
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install -r requirements.txt -r requirements-spark.txt
      - run: pytest -q -rs
