name: daily-pipeline

# Runs every day at 14:00 UTC (6-7am Pacific) for the previous UTC day.
# Also runnable by hand from the Actions tab ("Run workflow").
on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: write   # lets the job commit the refreshed dashboard

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      # GitHub runners start empty, so the SQLite file is carried between runs with the cache.
      # Each run saves a new cache entry; restore-keys picks up the most recent one.
      - name: Restore database
        uses: actions/cache/restore@v4
        with:
          path: data/grid_pulse.db
          key: grid-pulse-db-${{ github.run_id }}
          restore-keys: grid-pulse-db-

      - name: Run pipeline (backfill a year on the first run, then just yesterday)
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}   # add under Settings > Secrets and variables > Actions
        run: |
          if [ ! -f data/grid_pulse.db ]; then
            python -m src.pipeline --start "$(date -u -d '365 days ago' +%F)" --end "$(date -u -d 'yesterday' +%F)"
          else
            python -m src.pipeline
          fi

      - name: Rebuild dashboard and charts
        run: |
          python -m analysis.run_analysis
          python -m analysis.build_dashboard

      - name: Commit refreshed dashboard
        run: |
          git config user.name "grid-pulse bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "Daily dashboard refresh"
          git push

      - name: Save database
        if: always() && hashFiles('data/grid_pulse.db') != ''
        uses: actions/cache/save@v4
        with:
          path: data/grid_pulse.db
          key: grid-pulse-db-${{ github.run_id }}

      - name: Upload database as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: grid_pulse_db
          path: data/grid_pulse.db
          retention-days: 7
