name: daily-pipeline

# Runs every day at 14:00 UTC (6-7am Pacific) for the previous UTC day.
# Also runnable by hand from the Actions tab ("Run workflow").
on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "Rebuild the database from scratch with this many days of history (0 = normal daily run)"
        default: "0"

permissions:
  contents: write   # lets the job commit the refreshed dashboard
  issues: write     # lets the job open an issue when a run fails

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      # GitHub runners start empty, so the SQLite file is carried between runs with the cache.
      # Each run saves a new cache entry; restore-keys picks up the most recent one.
      - name: Restore database
        uses: actions/cache/restore@v4
        with:
          path: data/grid_pulse.db
          key: grid-pulse-db-${{ github.run_id }}
          restore-keys: grid-pulse-db-

      - name: Run pipeline (backfill a year on the first run, then just yesterday)
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}   # add under Settings > Secrets and variables > Actions
          BACKFILL_DAYS: ${{ github.event.inputs.backfill_days || '0' }}
        run: |
          if [ "$BACKFILL_DAYS" != "0" ]; then
            rm -f data/grid_pulse.db
            python -m src.pipeline --start "$(date -u -d "$BACKFILL_DAYS days ago" +%F)" --end "$(date -u -d 'yesterday' +%F)"
          elif [ ! -f data/grid_pulse.db ]; then
            python -m src.pipeline --start "$(date -u -d '365 days ago' +%F)" --end "$(date -u -d 'yesterday' +%F)"
          else
            python -m src.pipeline
          fi

      - name: Rebuild dashboard and charts
        run: |
          python -m analysis.run_analysis
          python -m analysis.build_dashboard

      - name: Commit refreshed dashboard
        run: |
          git config user.name "grid-pulse bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "Daily dashboard refresh"
          git push

      - name: Save database
        if: always() && hashFiles('data/grid_pulse.db') != ''
        uses: actions/cache/save@v4
        with:
          path: data/grid_pulse.db
          key: grid-pulse-db-${{ github.run_id }}

      - name: Upload database as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: grid_pulse_db
          path: data/grid_pulse.db
          retention-days: 7

      # Alerting: a failed run opens a GitHub issue (or comments on the open one), so failures can't go unnoticed.
      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TITLE="Daily pipeline failed"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "Failed again on $(date -u +%F). Run: $RUN_URL"
          else
            gh issue create --title "$TITLE" --body "The scheduled run failed on $(date -u +%F). Check the logs: $RUN_URL. The failing window is recorded in pipeline_runs.error_message."
          fi
